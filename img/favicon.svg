<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="50%" stop-color="#e8c49e"/>
      <stop offset="100%" stop-color="#b88050"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15212d"/>
      <stop offset="100%" stop-color="#0a1017"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  
  <!-- Stylized Geometric "M" & "A" Monogram -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- M Left Leg -->
    <path d="M16 44 L16 22 L27 34 L37 22 L37 44"/>
    <!-- A Peak & Crossbar Overlap -->
    <path d="M37 44 L44 22 L51 44"/>
    <path d="M40 37 L48 37" stroke-width="3.5"/>
  </g>
  
  <!-- Subtle Tech Sparkle Accent -->
  <circle cx="48" cy="18" r="2.2" fill="#e8c49e"/>
</svg>
